<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plataforma de analítica para equipos de producto</title>

    <!-- Next.js Metadata API: og por `property`, con la descripción pasada de largo -->
    <meta property="og:title" content="Plataforma de analítica para equipos de producto" />
    <meta
      property="og:description"
      content="Reunimos en un solo panel las métricas de producto, los embudos de activación y el comportamiento real de cada cohorte, para que el equipo decida qué construir con datos y no con opiniones sueltas de la última reunión de planificación."
    />
    <meta property="og:url" content="https://example.com/perfil/next-metadata" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://example.com/media/next-metadata-og.png" />

    <!-- Next.js Metadata API: twitter por `name` -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plataforma de analítica para equipos de producto" />
    <meta
      name="twitter:description"
      content="Métricas de producto, embudos de activación y comportamiento por cohorte en un solo panel."
    />
    <meta name="twitter:image" content="https://example.com/media/next-metadata-og.png" />
  </head>
  <body>
    <h1>Plataforma de analítica para equipos de producto</h1>
  </body>
</html>
