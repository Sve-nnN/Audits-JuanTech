<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guía completa de auditoría SEO técnica - Ejemplo</title>
    <meta name="description" content="Aprende a auditar tu sitio con una guía paso a paso." />

    <!-- Yoast SEO: Open Graph siempre por `property` -->
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Guía completa de auditoría SEO técnica" />
    <meta property="og:description" content="Aprende a auditar tu sitio con una guía paso a paso." />
    <meta property="og:url" content="https://ejemplo.com/guia-auditoria-seo/" />
    <meta property="og:site_name" content="Ejemplo" />
    <meta property="og:image" content="https://ejemplo.com/wp-content/uploads/og.jpg" />

    <!-- Yoast SEO: Twitter Cards siempre por `name` -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:label1" content="Tiempo de lectura" />
  </head>
  <body>
    <h1>Guía completa de auditoría SEO técnica</h1>
  </body>
</html>
