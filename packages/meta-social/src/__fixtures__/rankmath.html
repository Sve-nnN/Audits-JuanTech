<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auditoría SEO técnica: guía en 12 pasos claros - Ejemplo</title>
    <meta name="description" content="Guía práctica para auditar tu sitio paso a paso." />

    <!-- Rank Math: Open Graph por `property`, emisor sin defectos -->
    <meta property="og:locale" content="es_ES" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Auditoría SEO técnica: guía en 12 pasos claros" />
    <meta
      property="og:description"
      content="Guía práctica para auditar tu sitio: rastreo completo, errores técnicos, datos estructurados y rendimiento, con un plan de correcciones ordenado."
    />
    <meta property="og:url" content="https://example.com/perfil/rankmath" />
    <meta property="og:site_name" content="Ejemplo" />
    <meta property="og:image" content="https://example.com/media/rankmath-og.jpg" />

    <!-- Rank Math: Twitter Cards por `name` -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Auditoría SEO técnica: guía en 12 pasos claros" />
    <meta
      name="twitter:description"
      content="Guía práctica para auditar tu sitio: rastreo completo, errores técnicos, datos estructurados y rendimiento, con un plan de correcciones ordenado."
    />
    <meta name="twitter:image" content="https://example.com/media/rankmath-og.jpg" />
  </head>
  <body>
    <h1>Auditoría SEO técnica: guía en 12 pasos claros</h1>
  </body>
</html>
