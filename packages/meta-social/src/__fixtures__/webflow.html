<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Estudio de diseño digital en Bogotá</title>

    <!-- Webflow: Open Graph por `property`, sin og:url y sin og:type -->
    <meta property="og:title" content="Estudio de diseño digital en Bogotá" />
    <meta
      property="og:description"
      content="Diseñamos sitios y productos digitales para marcas que necesitan crecer sin perder identidad propia."
    />
    <meta property="og:image" content="https://example.com/media/webflow-portada.jpg" />

    <!-- Webflow: los campos de X salen por el atributo alterno y sin twitter:card -->
    <meta property="twitter:title" content="Estudio de diseño digital en Bogotá" />
    <meta
      property="twitter:description"
      content="Diseñamos sitios y productos digitales para marcas que necesitan crecer sin perder identidad propia."
    />
    <meta property="twitter:image" content="https://example.com/media/webflow-portada.jpg" />
  </head>
  <body>
    <h1>Estudio de diseño digital en Bogotá</h1>
  </body>
</html>
