<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camiseta de algodón orgánico color arena - Tienda Ejemplo</title>

    <!-- Shopify: Open Graph por `property`, con la imagen escrita sin protocolo -->
    <meta property="og:site_name" content="Tienda Ejemplo" />
    <meta property="og:url" content="https://example.com/perfil/shopify" />
    <meta property="og:title" content="Camiseta de algodón orgánico color arena" />
    <meta property="og:type" content="product" />
    <meta
      property="og:description"
      content="Camiseta de algodón orgánico certificado, tejido de 180 gramos y corte recto. Disponible de la talla XS a la XXL en tres colores neutros de temporada."
    />
    <meta property="og:image" content="//cdn.example.com/media/shopify-camiseta.jpg" />

    <!-- Shopify: Twitter Cards por `name`, sin twitter:image -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Camiseta de algodón orgánico color arena" />
    <meta
      name="twitter:description"
      content="Camiseta de algodón orgánico certificado, tejido de 180 gramos y corte recto. Disponible de la talla XS a la XXL en tres colores neutros de temporada."
    />
  </head>
  <body>
    <h1>Camiseta de algodón orgánico color arena</h1>
  </body>
</html>
